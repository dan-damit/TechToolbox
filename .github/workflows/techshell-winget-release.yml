name: TechShell MSIX / Winget Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "TechShell package version to build (for example 0.1.0). Defaults to the tag version without the leading v."
        required: false
        type: string
      release_tag:
        description: "GitHub release tag to publish the installer under. Defaults to the current tag or v<package_version>."
        required: false
        type: string
      submit_winget_pr:
        description: "Create a PR to microsoft/winget-pkgs after build completes (requires winget submission secrets)."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-msix-and-release:
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TECHTOOLBOX_SUBMODULES_PAT }}
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve TechShell version and release tag
        id: version
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $packageVersion = "${{ github.event.inputs.package_version }}"
          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            if (-not [string]::IsNullOrWhiteSpace($tagName) -and $tagName.StartsWith('v')) {
              $packageVersion = $tagName.Substring(1)
            }
          }

          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "Unable to determine the TechShell package version. Provide package_version or trigger from a v* tag."
          }

          $releaseTag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            if (-not [string]::IsNullOrWhiteSpace($tagName) -and $tagName.StartsWith('v')) {
              $releaseTag = $tagName
            }
            else {
              $releaseTag = "v$packageVersion"
            }
          }

          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Import code-signing certificate
        shell: pwsh
        env:
          TECHSHELL_CODE_SIGNING_PFX_BASE64: ${{ secrets.TECHSHELL_CODE_SIGNING_PFX_BASE64 }}
          TECHSHELL_CODE_SIGNING_PFX_PASSWORD: ${{ secrets.TECHSHELL_CODE_SIGNING_PFX_PASSWORD }}
          TECHSHELL_CODE_SIGNING_THUMBPRINT: ${{ secrets.TECHSHELL_CODE_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TECHSHELL_CODE_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:TECHSHELL_CODE_SIGNING_PFX_PASSWORD)) {
            throw "Missing GitHub Actions secrets TECHSHELL_CODE_SIGNING_PFX_BASE64 and/or TECHSHELL_CODE_SIGNING_PFX_PASSWORD."
          }

          $pfxBytes = [System.Convert]::FromBase64String($env:TECHSHELL_CODE_SIGNING_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'TechShellCodeSigning.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $securePassword = ConvertTo-SecureString -String $env:TECHSHELL_CODE_SIGNING_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -Password $securePassword -CertStoreLocation 'Cert:\CurrentUser\My' | Out-Null

          $thumbprint = $env:TECHSHELL_CODE_SIGNING_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            $thumbprint = (Get-ChildItem 'Cert:\CurrentUser\My' | Where-Object { $_.HasPrivateKey } | Select-Object -First 1).Thumbprint
          }

          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            throw "No code-signing certificate thumbprint was available after import."
          }

          $cert = Get-ChildItem 'Cert:\CurrentUser\My' | Where-Object { $_.Thumbprint -eq $thumbprint }
          if (-not $cert) {
            throw "The imported certificate with thumbprint $thumbprint was not found in CurrentUser\My."
          }

          Write-Host "Imported signing certificate: $($cert.Subject) [$thumbprint]"

      - name: Build TechShell MSIX and generate winget manifests
        shell: pwsh
        env:
          TECHSHELL_CODE_SIGNING_THUMBPRINT: ${{ secrets.TECHSHELL_CODE_SIGNING_THUMBPRINT }}
        run: |
          $thumbprint = $env:TECHSHELL_CODE_SIGNING_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            $thumbprint = '7168509FC1A2AE7AFC4C40342D6A8FED7413029C'
          }

          pwsh -NoProfile -File .\Config\Build-TechShellWinget.ps1 `
            -PackageVersion "${{ steps.version.outputs.package_version }}" `
            -ReleaseTag "${{ steps.version.outputs.release_tag }}" `
            -RuntimeIdentifier win-x64 `
            -InstallerFileName TechShell.msix `
            -Thumbprint $thumbprint

      - name: Upload TechShell MSIX to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          files: |
            Out/TechShell/${{ steps.version.outputs.package_version }}/win-x64/Installer/TechShell.msix
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload generated winget manifests as artifact
        uses: actions/upload-artifact@v4
        with:
          name: techshell-winget-manifests
          path: packaging/winget/TechToolbox.TechShell/**/*
          if-no-files-found: warn

  submit-winget-pr:
    needs: build-msix-and-release
    runs-on: ubuntu-latest
    if: needs.build-msix-and-release.result == 'success' && vars.ENABLE_WINGET_SUBMISSION == 'true' && (github.event_name == 'push' || github.event.inputs.submit_winget_pr == 'true')
    steps:
      - name: Download winget manifests artifact
        uses: actions/download-artifact@v4
        with:
          name: techshell-winget-manifests
          path: winget-manifests

      - name: Prepare winget-pkgs manifest branch and PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_PAT }}
          WINGET_PKGS_FORK: ${{ secrets.WINGET_PKGS_FORK }}
          WINGET_PKGS_FORK_OWNER: ${{ secrets.WINGET_PKGS_FORK_OWNER }}
          PACKAGE_VERSION: ${{ needs.build-msix-and-release.outputs.package_version }}
          RELEASE_TAG: ${{ needs.build-msix-and-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${WINGET_PKGS_FORK:-}" ] || [ -z "${WINGET_PKGS_FORK_OWNER:-}" ]; then
            echo "Missing one or more required secrets: WINGET_PKGS_PAT, WINGET_PKGS_FORK, WINGET_PKGS_FORK_OWNER"
            exit 1
          fi

          SOURCE_DIR="winget-manifests/${PACKAGE_VERSION}"
          if [ ! -d "$SOURCE_DIR" ]; then
            SOURCE_DIR="winget-manifests/packaging/winget/TechToolbox.TechShell/${PACKAGE_VERSION}"
          fi

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Unable to find generated manifests for version ${PACKAGE_VERSION} in downloaded artifact."
            ls -R winget-manifests || true
            exit 1
          fi

          BRANCH_NAME="techtoolbox-techshell-${PACKAGE_VERSION}-${GITHUB_RUN_NUMBER}"
          TARGET_DIR="manifests/t/TechToolbox/TechShell/${PACKAGE_VERSION}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${WINGET_PKGS_FORK}.git" winget-pkgs
          cd winget-pkgs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          mkdir -p "$TARGET_DIR"
          cp -f "../${SOURCE_DIR}/TechToolbox.TechShell.yaml" "$TARGET_DIR/"
          cp -f "../${SOURCE_DIR}/TechToolbox.TechShell.installer.yaml" "$TARGET_DIR/"
          cp -f "../${SOURCE_DIR}/TechToolbox.TechShell.locale.en-US.yaml" "$TARGET_DIR/"

          if git diff --quiet -- "$TARGET_DIR"; then
            echo "No manifest changes detected for ${PACKAGE_VERSION}. Skipping PR creation."
            exit 0
          fi

          git add "$TARGET_DIR"
          git commit -m "Add TechToolbox.TechShell ${PACKAGE_VERSION}"
          git push --set-upstream origin "$BRANCH_NAME"

          EXISTING_PR_URL="$(gh pr list \
            --repo microsoft/winget-pkgs \
            --head "${WINGET_PKGS_FORK_OWNER}:${BRANCH_NAME}" \
            --state open \
            --json url \
            --jq '.[0].url')"
          if [ -n "$EXISTING_PR_URL" ] && [ "$EXISTING_PR_URL" != "null" ]; then
            echo "A PR already exists for branch ${BRANCH_NAME}: $EXISTING_PR_URL"
            exit 0
          fi

          gh pr create \
            --repo microsoft/winget-pkgs \
            --base master \
            --head "${WINGET_PKGS_FORK_OWNER}:${BRANCH_NAME}" \
            --title "Add TechToolbox.TechShell version ${PACKAGE_VERSION}" \
            --body "Automated submission from TechToolbox release workflow for ${RELEASE_TAG}."
