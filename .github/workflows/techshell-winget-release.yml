name: TechShell MSIX / Winget Release

on:
  push:
    tags:
      - "techshell-v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "TechShell package version to build (for example 0.1.0). Defaults to the tag version without the leading techshell-v prefix."
        required: false
        type: string
      release_tag:
        description: "GitHub release tag to publish the installer under. Defaults to the current tag or techshell-v<package_version>."
        required: false
        type: string
      submit_winget_pr:
        description: "Create a PR to microsoft/winget-pkgs after build completes (requires winget submission secrets)."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-msix-and-release:
    runs-on: ${{ vars.TECHSHELL_RELEASE_RUNNER != '' && vars.TECHSHELL_RELEASE_RUNNER || 'windows-latest' }}
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Enforce hardened runner requirements
        shell: pwsh
        env:
          TECHSHELL_RELEASE_RUNNER: ${{ vars.TECHSHELL_RELEASE_RUNNER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TECHSHELL_RELEASE_RUNNER)) {
            throw "Repository variable TECHSHELL_RELEASE_RUNNER must be set to a dedicated self-hosted Windows runner label."
          }

          if (-not [string]::Equals($env:RUNNER_ENVIRONMENT, 'self-hosted', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "This workflow is hardened for self-hosted execution only. Current runner environment: '$env:RUNNER_ENVIRONMENT'."
          }

          if (-not [string]::Equals($env:RUNNER_OS, 'Windows', [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "This workflow requires a Windows runner. Current runner OS: '$env:RUNNER_OS'."
          }

          Write-Host "Runner hardening checks passed for '$env:RUNNER_NAME' (environment=$env:RUNNER_ENVIRONMENT, os=$env:RUNNER_OS)." -ForegroundColor Green

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TECHTOOLBOX_SUBMODULES_PAT }}
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Resolve TechShell version and release tag
        id: version
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $packageVersion = "${{ github.event.inputs.package_version }}"
          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            if (-not [string]::IsNullOrWhiteSpace($tagName) -and $tagName.StartsWith('techshell-v')) {
              $packageVersion = $tagName.Substring('techshell-v'.Length)
            }
          }

          if ([string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "Unable to determine the TechShell package version. Provide package_version or trigger from a techshell-v* tag."
          }

          $releaseTag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            if (-not [string]::IsNullOrWhiteSpace($tagName) -and $tagName.StartsWith('techshell-v')) {
              $releaseTag = $tagName
            }
            else {
              $releaseTag = "techshell-v$packageVersion"
            }
          }

          "package_version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Resolve code-signing certificate
        id: resolve-signing-cert
        shell: pwsh
        env:
          TECHSHELL_CODE_SIGNING_THUMBPRINT: ${{ secrets.TECHSHELL_CODE_SIGNING_THUMBPRINT }}
        run: |
          function Get-CodeSigningCertFromStores {
            param(
              [Parameter(Mandatory)]
              [string]$Thumbprint
            )

            foreach ($store in @('Cert:\CurrentUser\My', 'Cert:\LocalMachine\My')) {
              $candidate = Get-ChildItem -LiteralPath $store -ErrorAction SilentlyContinue |
                Where-Object { $_.Thumbprint -eq $Thumbprint -and $_.HasPrivateKey } |
                Select-Object -First 1
              if ($candidate) {
                return $candidate
              }
            }

            return $null
          }

          $thumbprint = $env:TECHSHELL_CODE_SIGNING_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            throw "Missing GitHub Actions secret TECHSHELL_CODE_SIGNING_THUMBPRINT. HSM signing flow requires an explicit thumbprint."
          }

          $cert = Get-CodeSigningCertFromStores -Thumbprint $thumbprint
          if (-not $cert) {
            throw "Code-signing certificate with private key for thumbprint $thumbprint was not found in CurrentUser\My or LocalMachine\My."
          }

          Write-Host "Using HSM-backed signing certificate from certificate store: $($cert.Subject) [$thumbprint]"
          "thumbprint=$thumbprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build TechShell MSIX and generate winget manifests
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.resolve-signing-cert.outputs.thumbprint }}"
          if ([string]::IsNullOrWhiteSpace($thumbprint)) {
            throw "Signing thumbprint output from the certificate resolution step was empty."
          }

          pwsh -NoProfile -File .\Config\Build-TechShellWinget.ps1 `
            -PackageVersion "${{ steps.version.outputs.package_version }}" `
            -ReleaseTag "${{ steps.version.outputs.release_tag }}" `
            -RuntimeIdentifier win-x64 `
            -InstallerFileName TechShell.msix `
            -Thumbprint $thumbprint

      - name: Upload TechShell MSIX to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          files: |
            Out/TechShell/${{ steps.version.outputs.package_version }}/win-x64/Installer/TechShell.msix
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload generated winget manifests as artifact
        uses: actions/upload-artifact@v4
        with:
          name: techshell-winget-manifests
          path: packaging/winget/TechToolbox.TechShell/**/*
          if-no-files-found: warn

  submit-winget-pr:
    needs: build-msix-and-release
    runs-on: ubuntu-latest
    if: needs.build-msix-and-release.result == 'success' && vars.ENABLE_WINGET_SUBMISSION == 'true' && (github.event_name == 'push' || github.event.inputs.submit_winget_pr == 'true')
    steps:
      - name: Download winget manifests artifact
        uses: actions/download-artifact@v4
        with:
          name: techshell-winget-manifests
          path: winget-manifests

      - name: Prepare winget-pkgs manifest branch and PR
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_PAT }}
          WINGET_PKGS_FORK: ${{ secrets.WINGET_PKGS_FORK }}
          WINGET_PKGS_FORK_OWNER: ${{ secrets.WINGET_PKGS_FORK_OWNER }}
          PACKAGE_VERSION: ${{ needs.build-msix-and-release.outputs.package_version }}
          RELEASE_TAG: ${{ needs.build-msix-and-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ] || [ -z "${WINGET_PKGS_FORK:-}" ] || [ -z "${WINGET_PKGS_FORK_OWNER:-}" ]; then
            echo "Missing one or more required secrets: WINGET_PKGS_PAT, WINGET_PKGS_FORK, WINGET_PKGS_FORK_OWNER"
            exit 1
          fi

          export GIT_TERMINAL_PROMPT=0

          WINGET_PKGS_FORK="${WINGET_PKGS_FORK#https://github.com/}"
          WINGET_PKGS_FORK="${WINGET_PKGS_FORK#git@github.com:}"
          WINGET_PKGS_FORK="${WINGET_PKGS_FORK%.git}"

          if [ -z "${WINGET_PKGS_FORK:-}" ] || [[ "${WINGET_PKGS_FORK}" != */* ]]; then
            echo "WINGET_PKGS_FORK must be set to a GitHub fork in owner/repo format, for example: yourname/winget-pkgs"
            exit 1
          fi

          SOURCE_DIR=""
          for candidate in \
            "winget-manifests/${PACKAGE_VERSION}" \
            "winget-manifests/packaging/winget/TechToolbox.TechShell/${PACKAGE_VERSION}" \
            "winget-manifests/TechToolbox.TechShell/${PACKAGE_VERSION}" \
            "winget-manifests/packaging/winget/TechToolbox.TechShell" \
            "winget-manifests/TechToolbox.TechShell"; do
            if [ -f "${candidate}/TechToolbox.TechShell.yaml" ] && [ -f "${candidate}/TechToolbox.TechShell.installer.yaml" ] && [ -f "${candidate}/TechToolbox.TechShell.locale.en-US.yaml" ]; then
              SOURCE_DIR="$candidate"
              break
            fi
          done

          if [ -z "$SOURCE_DIR" ]; then
            echo "Unable to find generated manifests for version ${PACKAGE_VERSION} in downloaded artifact."
            echo "Downloaded artifact layout:"
            find winget-manifests -maxdepth 5 -print 2>/dev/null || true
            exit 1
          fi

          if gh api "repos/microsoft/winget-pkgs/contents/manifests/t/TechToolbox/TechShell/${PACKAGE_VERSION}" --jq '.name' >/dev/null 2>&1; then
            echo "Version ${PACKAGE_VERSION} already exists in microsoft/winget-pkgs. Skipping PR creation."
            exit 0
          fi

          BRANCH_NAME="techtoolbox-techshell-${PACKAGE_VERSION}-${GITHUB_RUN_NUMBER}"
          TARGET_DIR="manifests/t/TechToolbox/TechShell/${PACKAGE_VERSION}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${WINGET_PKGS_FORK}.git" winget-pkgs
          cd winget-pkgs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          mkdir -p "$TARGET_DIR"
          cp -f "../${SOURCE_DIR}/TechToolbox.TechShell.yaml" "$TARGET_DIR/"
          cp -f "../${SOURCE_DIR}/TechToolbox.TechShell.installer.yaml" "$TARGET_DIR/"
          cp -f "../${SOURCE_DIR}/TechToolbox.TechShell.locale.en-US.yaml" "$TARGET_DIR/"

          if git diff --quiet -- "$TARGET_DIR"; then
            echo "No manifest changes detected for ${PACKAGE_VERSION}. Skipping PR creation."
            exit 0
          fi

          git add "$TARGET_DIR"
          git commit -m "Add TechToolbox.TechShell ${PACKAGE_VERSION}"
          git push --set-upstream origin "$BRANCH_NAME"

          EXISTING_PR_URL="$(gh pr list \
            --repo microsoft/winget-pkgs \
            --head "${WINGET_PKGS_FORK_OWNER}:${BRANCH_NAME}" \
            --state open \
            --json url \
            --jq '.[0].url')"
          if [ -n "$EXISTING_PR_URL" ] && [ "$EXISTING_PR_URL" != "null" ]; then
            echo "A PR already exists for branch ${BRANCH_NAME}: $EXISTING_PR_URL"
            exit 0
          fi

          gh pr create \
            --repo microsoft/winget-pkgs \
            --base master \
            --head "${WINGET_PKGS_FORK_OWNER}:${BRANCH_NAME}" \
            --title "Add TechToolbox.TechShell version ${PACKAGE_VERSION}" \
            --body "Automated submission from TechToolbox release workflow for ${RELEASE_TAG}."
